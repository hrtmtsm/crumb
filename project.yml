name: crumb
options:
  developmentLanguage: ja
configs:
  Debug: debug
  Release: release
  Device Preview: debug
schemes:
  crumb (iCloud):
    build:
      targets:
        crumb: all
    run:
      config: Debug
  crumb Device Preview:
    build:
      targets:
        crumb: all
    run:
      config: Device Preview
    test:
      config: Device Preview
    profile:
      config: Device Preview
    analyze:
      config: Device Preview
    archive:
      config: Device Preview
targets:
  crumb:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Crumb]
    configFiles:
      Debug: Config/Defaults.xcconfig
      Release: Config/Defaults.xcconfig
      Device Preview: Config/Defaults.xcconfig
    info:
      path: CrumbInfo.plist
      properties:
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconFiles: [CrumbIcon]
        NSCameraUsageDescription: ガイドに合わせて料理やお皿を撮影し、レシピに保存します。
        NSPhotoLibraryUsageDescription: レシピに使う料理写真を最近の写真から選びます。
        CrumbSupabaseURL: $(SUPABASE_URL)
        CrumbSupabaseKey: $(SUPABASE_PUBLISHABLE_KEY)
        UIAppFonts: [BricolageGrotesque-Bold.ttf, Nunito-Regular.ttf, Nunito-SemiBold.ttf, Nunito-Medium.ttf]
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: CrumbAuth.entitlements
        DEVELOPMENT_TEAM: DW8V3D3NS2
        PRODUCT_BUNDLE_IDENTIFIER: app.tabinote.meals
        INFOPLIST_KEY_CFBundleDisplayName: crumb
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
      configs:
        Device Preview:
          CODE_SIGN_ENTITLEMENTS: ""
          CODE_SIGN_STYLE: Automatic
          PRODUCT_BUNDLE_IDENTIFIER: app.tabinote.meals.preview
          INFOPLIST_KEY_CFBundleDisplayName: crumb Preview
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) CRUMB_DEVICE_PREVIEW"
